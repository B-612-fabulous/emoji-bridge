plugins {
    id 'com.android.application'
}

// ── 本机私有配置 ────────────────────────────────────────────────
// 打赏收款链接不写进源码，改为从项目根目录的 local.properties 读取。
// local.properties 已在 .gitignore 里，克隆仓库的人拿不到它 → 值是空字符串
// → 打赏里的「支付宝」按钮自动隐藏，但工程照常编译、功能照常可用。
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def donateAlipayQr = localProps.getProperty('donate.alipay.qr', '')

android {
    namespace 'com.example.emojibridge'
    compileSdk 35
    buildToolsVersion "35.0.1"

    defaultConfig {
        applicationId "com.example.emojibridge"
        minSdk 24
        targetSdk 34
        versionCode 47
        versionName "0.8.9"

        // 支付宝收款码链接（形如 https://qr.alipay.com/xxxx），空值即"未配置"
        buildConfigField "String", "DONATE_ALIPAY_QR", "\"${donateAlipayQr}\""
    }

    buildFeatures {
        // 需要 BuildConfig.DONATE_ALIPAY_QR
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // 输出文件名默认是 app-debug.apk，发给别人看不出这是什么。
    // 改成「表情搬运工-0.6.0.apk」，版本号自动跟着 versionName 走，
    // 以后改版本号不用再动这里。
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "表情搬运工-${variant.versionName}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    // 动态 WebP 解码（转 GIF 用）+ 让 Glide 预览动画表情
    implementation 'com.github.penfeizhou.android.animation:awebp:3.0.5'
    implementation 'com.github.penfeizhou.android.animation:glide-plugin:3.0.5'
}
